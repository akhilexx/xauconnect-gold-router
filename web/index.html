<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>XAUConnect Gold Router on NEAR Intents</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { color: #9a7400; } textarea { width: 100%; height: 220px; font: 13px monospace; }
  button { background: #c9a227; border: 0; padding: .6rem 1.2rem; font-weight: 600; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; } td, th { border-bottom: 1px solid #ddd; padding: .35rem; text-align: left; }
  .muted { color: #777; } .bad { color: #b00; }
</style>
<h1>Gold Router</h1>
<p class="muted">Turn stablecoins scattered across chains into tokenized gold (XAUT) in one plan. Quotes come from NEAR Intents 1Click (dry run). Nothing is signed or sent from this page.</p>
<textarea id="intent">{
  "sources": [
    { "symbol": "USDC", "chain": "arb", "amount": "100", "refundTo": "0xYourArbitrumAddress" },
    { "symbol": "USDT", "chain": "eth", "amount": "60",  "refundTo": "0xYourEthereumAddress" }
  ],
  "deliveries": [
    { "symbol": "XAUT", "chain": "eth", "mode": "DESTINATION_CHAIN", "recipient": "0xYourEthereumAddress" }
  ],
  "slippageBps": 50
}</textarea>
<p><button id="go">Plan route</button></p>
<div id="out"></div>
<script>
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
document.getElementById("go").onclick = async () => {
  const out = document.getElementById("out");
  out.textContent = "Quoting...";
  try {
    const r = await fetch("/v1/routes", { method: "POST", headers: { "Content-Type": "application/json" }, body: document.getElementById("intent").value });
    const p = await r.json();
    if (p.error) { out.innerHTML = `<p class="bad">${esc(p.error)}</p>`; return; }
    let h = "<table><tr><th>From</th><th>To</th><th>Receive</th><th>In $</th><th>Out $</th><th>Cost</th><th>ETA</th></tr>";
    for (const l of p.legs) h += `<tr><td>${esc(l.source.amount)} ${esc(l.source.symbol)}@${esc(l.source.chain)}</td><td>${esc(l.delivery.symbol)}@${esc(l.delivery.chain)} (${esc(l.delivery.mode)})</td><td>${esc(l.amountOutFormatted)}</td><td>${l.amountInUsd.toFixed(2)}</td><td>${l.amountOutUsd.toFixed(2)}</td><td>${l.costBps} bps</td><td>${l.timeEstimateSec}s</td></tr>`;
    h += `</table><p><b>Total:</b> $${p.totals.amountInUsd} in, $${p.totals.amountOutUsd} out (${p.totals.costBps} bps)</p>`;
    for (const x of p.rejected) h += `<p class="bad">Blocked by policy: ${esc(x.source.symbol)}@${esc(x.source.chain)}: ${esc(x.reason)}</p>`;
    for (const f of p.failures) h += `<p class="bad">No quote: ${esc(f.source.symbol)}@${esc(f.source.chain)} → ${esc(f.delivery.symbol)}@${esc(f.delivery.chain)}: ${esc(f.error)}</p>`;
    out.innerHTML = h;
  } catch (e) { out.innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
};
</script>
</html>
